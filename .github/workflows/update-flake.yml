name: Update Flake Inputs

on:
  schedule:
    # Every 6 hours UTC (01/07/13/19), off the hour to avoid GitHub's top-of-hour schedule congestion
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

jobs:
  update-flake:
    name: Update flake inputs
    runs-on: ubuntu-latest
    concurrency:
      group: update-flake
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://nixos.org/nix/install
          extra_nix_config: |
            auto-optimise-store = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: Update flake inputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix flake update
          git diff --stat -- flake.lock

      - name: Refresh opencode node_modules hash
        run: |
          # opencode follows our nixpkgs, so its bun/node_modules output can
          # drift from upstream: poison the hash, rebuild, and read back the
          # expected hash (same fake-hash pattern as update-turso-cli.yml).
          set -euo pipefail
          FILE="home/terminal/programs/opencode.nix"
          FAKE_HASH="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          echo "Computing expected opencode node_modules hash..."
          set +e
          BUILD_LOG=$(nix build --impure --expr "let flake = builtins.getFlake \"git+file://$PWD\"; opencodePkg = flake.inputs.opencode.packages.x86_64-linux.default; overridden = opencodePkg.overrideAttrs (old: { node_modules = old.node_modules.override { hash = \"${FAKE_HASH}\"; }; }); in overridden.node_modules" --no-link 2>&1)
          set -e
          echo "$BUILD_LOG" | tail -n 20
          NEW_HASH=$(echo "$BUILD_LOG" | grep -oP 'got:\s*\Ksha256-[A-Za-z0-9+/=]+' | head -1 || true)
          if [ -z "$NEW_HASH" ]; then
            echo "Failed to extract expected node_modules hash from build log"
            exit 1
          fi
          echo "Expected hash: $NEW_HASH"
          CURRENT_HASH=$(sed -n '/node_modules/,/hash =/ s/.*hash = "\(sha256-[^"]*\)".*/\1/p' "$FILE" | head -1)
          echo "Current hash: $CURRENT_HASH"
          if [ "$NEW_HASH" != "$CURRENT_HASH" ]; then
            sed -i "/node_modules/,/hash =/ s|hash = \"sha256-[^\"]*\"|hash = \"${NEW_HASH}\"|" "$FILE"
            echo "Updated $FILE to $NEW_HASH"
            git diff -- "$FILE"
          else
            echo "opencode node_modules hash already up to date"
          fi
          echo "Verifying opencode builds with updated hash..."
          nix build --impure --expr "let flake = builtins.getFlake \"git+file://$PWD\"; opencodePkg = flake.inputs.opencode.packages.x86_64-linux.default; overridden = opencodePkg.overrideAttrs (old: { node_modules = old.node_modules.override { hash = \"${NEW_HASH}\"; }; postInstall = \"\"; }); in overridden" --no-link

      - name: Check for lockfile changes
        id: lock-changed
        run: |
          if git diff --quiet -- flake.lock home/terminal/programs/opencode.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No flake input updates available"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run nix flake check (warnings gate automerge)
        id: flake-check
        if: steps.lock-changed.outputs.changed == 'true'
        run: |
          set +e
          nix flake check 2>&1 | tee /tmp/flake-check.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if grep -qiE '^[[:space:]]*warning:' /tmp/flake-check.log; then
            echo "has_warnings=true" >> "$GITHUB_OUTPUT"
            echo "::warning::nix flake check produced warnings - automerge disabled"
            grep -iE '^[[:space:]]*warning:' /tmp/flake-check.log || true
          else
            echo "has_warnings=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$EXIT_CODE"

      - name: Get date for branch
        id: date
        if: steps.lock-changed.outputs.changed == 'true'
        run: echo "date=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create-pr
        if: steps.lock-changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/flake-lock
          delete-branch: true
          commit-message: "update: flake inputs ${{ steps.date.outputs.date }}"
          title: "update: flake inputs ${{ steps.date.outputs.date }}"
          body: >-
            Automated `nix flake update` (6-hourly schedule).

            Also refreshes the `opencode` `node_modules` hash in
            `home/terminal/programs/opencode.nix`.

            Automerge is enabled only when `nix flake check` passes with no
            warnings. If warnings were detected, this PR is left open for
            manual review.

      - name: Comment on PR when warnings detected
        if: steps.create-pr.outputs.pull-request-number != '' && steps.flake-check.outputs.has_warnings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh pr comment ${{ steps.create-pr.outputs.pull-request-number }}
          --body "nix flake check passed but emitted warnings, so automerge was skipped. Please review the check log before merging."

      - name: Enable auto-merge (only when check has no warnings)
        if: steps.create-pr.outputs.pull-request-number != '' && steps.flake-check.outputs.has_warnings == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh pr merge --auto --rebase
          ${{ steps.create-pr.outputs.pull-request-number }}
